name: Feature request
description: Suggest an improvement to JoinAssist.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem and the proposed behavior. Use generic SQL examples.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or alternatives
      description: Do not include credentials, business data or private connection details.
