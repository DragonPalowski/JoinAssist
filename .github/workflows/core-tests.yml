name: Core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x
      - name: Restore pinned dependencies
        run: dotnet restore tests/JoinAssist.CoreTests/JoinAssist.CoreTests.csproj --locked-mode
      - name: Build core tests
        run: dotnet build tests/JoinAssist.CoreTests/JoinAssist.CoreTests.csproj --configuration Release --no-restore
      - name: Run core tests without SSMS or a SQL Server
        shell: pwsh
        run: |
          & ./tests/JoinAssist.CoreTests/bin/Release/net48/JoinAssist.CoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
